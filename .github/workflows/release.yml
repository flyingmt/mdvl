name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Resolve tag
        id: version
        shell: bash
        # Both come in through the environment rather than `${{ }}` inside the
        # script: a dispatch input is attacker-shaped text, and interpolating it
        # into a shell would run it.
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          case "$tag" in
            v[0-9]*) ;;
            *) echo "::error::refusing to release from tag '$tag' — expected vMAJOR.MINOR.PATCH" >&2; exit 1 ;;
          esac
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6

      # Cargo.toml is the product's version — it is what `mdvl --version`
      # prints, and `cargo build --locked` requires it to agree with
      # Cargo.lock, so CI must not rewrite it. Check it instead, here, before
      # anything is built or published: a mismatch found now costs a retag,
      # while the same mismatch found later ships binaries that misreport
      # themselves.
      - name: Cargo.toml must match the tag
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$crate" != "$VERSION" ]; then
            echo "::error::Cargo.toml is $crate but the tag asks for $VERSION." >&2
            echo "Bump Cargo.toml (and Cargo.lock, via any cargo command), then retag." >&2
            exit 1
          fi
          echo "Cargo.toml $crate matches the tag."

  build:
    name: Build ${{ matrix.target }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `macos-26` is the arm64 image; `macos-26-arm64` names the image in
          # actions/runner-images but is not a label any runner answers to, so
          # a job asking for it queues until the run is cancelled.
          - target: aarch64-apple-darwin
            runner: macos-26
            archive: mdvl-darwin-arm64.tar.gz
          - target: x86_64-apple-darwin
            runner: macos-26-intel
            archive: mdvl-darwin-x64.tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            archive: mdvl-windows-x64.zip
            crt_static: '1'
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            archive: mdvl-linux-x64.tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            archive: mdvl-linux-arm64.tar.gz

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web app
        run: |
          npm ci
          npm run build
        working-directory: web

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Build binary (macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build binary (Windows, static CRT)
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build binary (Linux)
        if: runner.os == 'Linux'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czf "dist/${{ matrix.archive }}" -C target/${{ matrix.target }}/release mdvl

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/mdvl.exe" -DestinationPath "dist/${{ matrix.archive }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  collect:
    name: Compute checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Extract binaries and compute SHA-256
        run: |
          mkdir -p binaries dist
          for dir in artifacts/*/; do
            archive=$(basename "$dir")
            file=$(ls "$dir" | head -1)
            cp "${dir}${file}" "dist/$file"
            target=$(echo "$file" | sed 's/^mdvl-//; s/\.tar\.gz$//; s/\.zip$//')
            mkdir -p "binaries/$target"
            if [[ "$file" == *.zip ]]; then
              unzip -o "${dir}${file}" -d "binaries/$target"
            else
              tar -xzf "${dir}${file}" -C "binaries/$target"
            fi
          done

          node -e "
          const fs = require('fs');
          const crypto = require('crypto');
          const path = require('path');
          const map = {};
          for (const target of fs.readdirSync('binaries')) {
            const dir = path.join('binaries', target);
            const binName = fs.existsSync(path.join(dir, 'mdvl.exe')) ? 'mdvl.exe' : 'mdvl';
            const binPath = path.join(dir, binName);
            const hash = crypto.createHash('sha256').update(fs.readFileSync(binPath)).digest('hex');
            map[target] = hash;
          }
          fs.writeFileSync('checksums.json', JSON.stringify(map, null, 2));
          console.log(JSON.stringify(map, null, 2));
          "

      - uses: actions/upload-artifact@v7
        with:
          name: checksums
          path: checksums.json

      - uses: actions/upload-artifact@v7
        with:
          name: archives
          path: dist/*

  publish-children:
    name: Publish ${{ matrix.name }}
    needs: [resolve, collect]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            os: darwin
            cpu: arm64
          - name: darwin-x64
            os: darwin
            cpu: x64
          - name: windows-x64
            os: win32
            cpu: x64
          - name: linux-x64
            os: linux
            cpu: x64
            libc: glibc
          - name: linux-arm64
            os: linux
            cpu: arm64
            libc: glibc

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v8
        with:
          name: archives
          path: dist

      - name: Prepare child package
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TARGET: ${{ matrix.name }}
          OS: ${{ matrix.os }}
          CPU: ${{ matrix.cpu }}
          LIBC: ${{ matrix.libc }}
        run: |
          mkdir -p child-pkg
          if [[ "$OS" == "win32" ]]; then
            unzip -o "dist/mdvl-${TARGET}.zip" -d child-pkg
          else
            tar -xzf "dist/mdvl-${TARGET}.tar.gz" -C child-pkg
          fi

          if [ -n "$LIBC" ]; then
            LIBC_LINE="\"libc\": [\"$LIBC\"],"
          else
            LIBC_LINE=""
          fi

          printf '{\n  "name": "@flyingmt/mdvl-%s",\n  "version": "%s",\n  "description": "mdvl native binary for %s",\n  "license": "MIT",\n  "os": ["%s"],\n  "cpu": ["%s"],\n  %s"files": ["mdvl", "mdvl.exe"]\n}\n' \
            "$TARGET" "$VERSION" "$TARGET" "$OS" "$CPU" "$LIBC_LINE" > child-pkg/package.json

      - name: Publish child package
        run: |
          cd child-pkg
          npm publish --access public --provenance || echo "already published (version immutable)"

  publish-root:
    name: Publish root package
    needs: [resolve, collect, publish-children]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v8
        with:
          name: checksums
          path: installer

      # The child packages take their version from the tag, so the root has to
      # as well or the two drift: a root published from a stale committed
      # version either collides with what npm already has, or resolves
      # `optionalDependencies` to binaries from a different release. The
      # committed numbers in installer/package.json are a placeholder — the tag
      # decides.
      - name: Stamp the version from the tag
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          cd installer
          npm pkg set "version=$VERSION"
          for target in darwin-arm64 darwin-x64 windows-x64 linux-x64 linux-arm64; do
            npm pkg set "optionalDependencies.@flyingmt/mdvl-$target=$VERSION"
          done
          npm pkg get version optionalDependencies

      - name: Publish root package
        run: |
          cd installer
          npm publish --access public --provenance || echo "already published (version immutable)"

  release:
    name: Publish GitHub release
    needs: [resolve, collect, publish-root]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: archives
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists (immutable). Skipping."
          else
            gh release create "$TAG" dist/* --generate-notes --latest --target "$GITHUB_SHA"
          fi
