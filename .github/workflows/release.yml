name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web app
        run: |
          npm ci
          npm run build
        working-directory: web

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build binary
        run: cargo build --release --locked

      - name: Package binary
        id: package
        shell: pwsh
        run: |
          $os = $env:RUNNER_OS.ToLowerInvariant()
          $arch = $env:RUNNER_ARCH.ToLowerInvariant()
          $name = "mdvl-$os-$arch"
          New-Item -ItemType Directory -Path package | Out-Null

          if ($env:RUNNER_OS -eq "Windows") {
            Copy-Item target/release/mdvl.exe package/mdvl.exe
            Compress-Archive -Path package/mdvl.exe -DestinationPath "$name.zip"
            "asset=$name.zip" >> $env:GITHUB_OUTPUT
          } else {
            Copy-Item target/release/mdvl package/mdvl
            tar -czf "$name.tar.gz" -C package mdvl
            "asset=$name.tar.gz" >> $env:GITHUB_OUTPUT
          }

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --generate-notes --latest --target "$GITHUB_SHA"
          fi
